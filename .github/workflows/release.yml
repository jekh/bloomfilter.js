name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v1.1.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: ref
        run: |
          echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate package version matches tag
        env:
          TAG: ${{ steps.ref.outputs.tag }}
        run: |
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match package.json version $VERSION." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Pack release artifact
        id: pack
        run: |
          npm pack --json > pack.json
          PACKAGE_FILE="$(node -p "JSON.parse(require('node:fs').readFileSync('pack.json', 'utf8'))[0].filename")"
          sha256sum "$PACKAGE_FILE" > "$PACKAGE_FILE.sha256"
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ref.outputs.tag }}
          PACKAGE_FILE: ${{ steps.pack.outputs.file }}
        run: |
          gh release create "$TAG" \
            "$PACKAGE_FILE" \
            "$PACKAGE_FILE.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
